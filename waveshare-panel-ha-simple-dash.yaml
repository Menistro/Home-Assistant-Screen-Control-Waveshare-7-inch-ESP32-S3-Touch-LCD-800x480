# ==============================================================================
# 9. HOME ASSISTANT TWO-WAY SYNC RECEIVERS
# ==============================================================================
# This section listens for external state changes (e.g., someone uses the HA App).
# It enforces the "Sync Lock Sandwich" logic to update the UI without echoing.

binary_sensor:
  # --- SINK SWITCH SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_kitchen_sink
    id: ha_sink_state
    on_state:
        # STEP 1: Lock the UI so the screen knows HA is driving
        - globals.set:           
            id: ui_lock
            value: 'true'
        # STEP 2: Update the physical graphics
        - lvgl.switch.update:
            id: sink_switch
            state:
              checked: !lambda "return x;"
        # STEP 3: Unlock the UI so the user can touch it again
        - globals.set:           
            id: ui_lock
            value: 'false'

  # --- DRYING RACK SWITCH SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_over_drying_rack
    id: ha_rack_state
    on_state:
      - globals.set:           
          id: ui_lock
          value: 'true'
      - lvgl.switch.update:
          id: rack_switch
          state:
            checked: !lambda "return x;"
      - globals.set:           
          id: ui_lock
          value: 'false'

  # --- COFFEE MACHINE SWITCH SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_kitchen_coffee_machine
    id: ha_coffee_state
    on_state:
      - globals.set:           
          id: ui_lock
          value: 'true'
      - lvgl.switch.update:
          id: coffee_switch
          state:
            checked: !lambda "return x;"
      - globals.set:           
          id: ui_lock
          value: 'false'

  # --- TV SHELVES SWITCH SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_shelves_above_tv
    id: ha_tv_state
    on_state:
      - globals.set:           
          id: ui_lock
          value: 'true'
      - lvgl.switch.update:
          id: tv_switch
          state:
            checked: !lambda "return x;"
      - globals.set:           
          id: ui_lock
          value: 'false'

sensor:
  # ==========================================
  # BRIGHTNESS SYNC SENSORS
  # ==========================================
  # Converts Home Assistant's 0-255 brightness scale back into LVGL's 0-100 scale
  
  # --- SINK BRIGHTNESS SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_kitchen_sink
    attribute: brightness
    id: ha_sink_brightness
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x) && x > 0;' 
          then:
            - globals.set:           
                id: ui_lock
                value: 'true'
            - lvgl.slider.update:
                id: sink_bri_slider
                value: !lambda 'return (x / 255.0) * 100.0;'
            - globals.set:           
                id: ui_lock
                value: 'false'

  # --- DRYING RACK BRIGHTNESS SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_over_drying_rack
    attribute: brightness
    id: ha_rack_brightness
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x) && x > 0;' 
          then:
            - globals.set:           
                id: ui_lock
                value: 'true'
            - lvgl.slider.update:
                id: rack_bri_slider
                value: !lambda 'return (x / 255.0) * 100.0;'
            - globals.set:           
                id: ui_lock
                value: 'false'

  # --- COFFEE MACHINE BRIGHTNESS SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_kitchen_coffee_machine
    attribute: brightness
    id: ha_coffee_brightness
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x) && x > 0;' 
          then:
            - globals.set:           
                id: ui_lock
                value: 'true'
            - lvgl.slider.update:
                id: coffee_bri_slider
                value: !lambda 'return (x / 255.0) * 100.0;'
            - globals.set:           
                id: ui_lock
                value: 'false'

  # --- TV SHELVES BRIGHTNESS SYNC ---
  - platform: homeassistant
    entity_id: light.led_strip_shelves_above_tv
    attribute: brightness
    id: ha_tv_brightness
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x) && x > 0;' 
          then:
            - globals.set:           
                id: ui_lock
                value: 'true'
            - lvgl.slider.update:
                id: tv_bri_slider
                value: !lambda 'return (x / 255.0) * 100.0;'
            - globals.set:           
                id: ui_lock
                value: 'false'

